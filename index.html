function mountVideo(){const m=$("#media");m.querySelectorAll("video").forEach(e=>e.remove());m.classList.remove("ok");if(!VIDEO)return;const v=document.createElement("video");v.muted=true;v.autoplay=true;v.loop=true;v.playsInline=true;v.disablePictureInPicture=true;["playsinline","muted","disablepictureinpicture"].forEach(a=>v.setAttribute(a,""));v.setAttribute("controlslist","nodownload noremoteplayback");v.oncontextmenu=e=>e.preventDefault();v.onerror=()=>v.remove();v.oncanplay=()=>m.classList.add("ok");v.src=VIDEO;m.appendChild(v);const pl=()=>v.play().catch(()=>{});pl();["click","touchstart","scroll"].forEach(t=>addEventListener(t,pl,{once:true,passive:true}))}
function initReveal(){if(!("IntersectionObserver" in window))return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.06});document.querySelectorAll("main section:not(.hero),.row3b>div,.hero>.media").forEach(e=>{e.classList.add("reveal");io.observe(e)})}

function list(){let l=P.filter(p=>(view=="all"||p.c==view)&&p.pr<=fil.price&&(!q||(p.en+p.ur).toLowerCase().includes(q))&&(!fil.col||p.col.includes(fil.col))&&(!fil.sz||p.sz.includes(fil.sz))&&(!fil.br.length||fil.br.includes(p.br)));const s=$("#sort").value;if(s=="lo")l.sort((a,b)=>a.pr-b.pr);else if(s=="hi")l.sort((a,b)=>b.pr-a.pr);else l.sort((a,b)=>b.rt-a.rt);return l}
function card(p){const bd=p.bd||(p.was>p.pr?"-"+Math.round((1-p.pr/p.was)*100)+"%":""),b=bd?`<span class="tag ${bd=="New"?"n":bd=="Hot"?"h":""}">${bd}</span>`:"";return `<div class="p glass ${sel&&sel.id==p.id?"sel":""}" onclick="pick('${p.id}')"><div class="pic">${pic(p)}${b}</div><h4>${t(p)}</h4>${p.rt?`<div class="rt"><i>★</i> ${p.rt} (${p.rn||0})</div>`:""}<div class="pr">PKR ${p.pr.toLocaleString()} ${p.was?`<s>PKR ${p.was.toLocaleString()}</s>`:""}</div><a class="wab" target="_blank" rel="noopener" onclick="event.stopPropagation()" href="${wa("Hello, I want to order:\n\nProduct: "+p.en+"\nPrice: PKR "+p.pr.toLocaleString()+"\nProduct ID: "+p.id+"\n\nPlease confirm availability.")}">${ico("wa")} ${T("ord")}</a></div>`}
function pick(id){const p0=P.find(p=>p.id==id);if(view=="home"||(view!="all"&&view!=p0.c))go(p0.c);sel=p0;sel.q=1;sel.c1=sel.col[0];sel.s1=sel.sz[0];draw();panel();if(innerWidth<760)$("#panel").classList.add("open");else if(innerWidth<1100)$("#panel").scrollIntoView({behavior:"smooth"})}

 $("#panel").innerHTML=`<button class="x" onclick="$('#panel').classList.remove('open')" aria-label="close">×</button><div class="pic">${pic(p)}</div><h3>${t(p)}</h3>${p.rt?`<div class="rt"><i>★</i> ${p.rt} (${p.rn||0})</div>`:""}<div class="pr" style="font-size:1.3rem">PKR ${p.pr.toLocaleString()} ${p.was?`<s>PKR ${p.was.toLocaleString()}</s>`:""}</div>${p.was>p.pr?`<div class="save">🏷️ Save PKR ${(p.was-p.pr).toLocaleString()}</div>`:""}

 <div class="mini">${T("mn").map((x,i)=>`<div>${["🛡️","🧾","🎧"][i]}<br>${x}</div>`).join("")}</div>`}
function filters(){const c=Object.keys(COLORS);$("#fl").innerHTML=`<h3>${T("fp")}</h3><input type="range" min="1000" max="15000" step="500" value="${fil.price}" oninput="fil.price=+this.value;$('#pv').textContent=this.value;draw()"><small>PKR 1,000 – <span id="pv">${fil.price}</span></small>
 <h3>${T("fc")}</h3>${c.map(x=>`<span class="dot ${fil.col==x?"on":""}" style="background:${COLORS[x]}" title="${x}" onclick="fil.col=fil.col=='${x}'?null:'${x}';filters();draw()"></span>`).join("")}

 $("#addr").textContent=ADDRESS;$("#dir").href=DIRLINK;$("#open").href=MAPLINK;if($("#mapA"))$("#mapA").href=MAPLINK;$("#rn").placeholder=T("nameph");$("#rm").placeholder=T("cmph");

 if(!home){$("#bt").textContent=view=="all"?(lang=="en"?"Search & All Products":"تلاش اور تمام مصنوعات"):t(cn(view));$("#fbtn").textContent=lang=="en"?"🎚 Filter":"🎚 فلٹر";$("#q").placeholder=lang=="en"?"Search products…":"مصنوعات تلاش کریں…";$("#bs").textContent=T("sub2");filters();if(!sel)panel();draw();panel()}
